# Copy to .github/workflows/plune-report.yml. Sends a Maven (JUnit 5) run to Plune.
#
# Surefire writes a JUnit XML file per test class into target/surefire-reports, and the action reads
# that folder as one run (@plune-ai/cli 0.32.0 or newer, the default cli-version): nothing to add to
# the pom. Keys are classname#name without parentheses (cart.CartTest#addsAnItem); Gradle and Allure
# keep them, so switching between them meets the cases under other keys. Surefire writes no suite
# timestamp, so a test's span ends when the import reads the report and lasts the test's own time
# (CLI 0.32.1 or newer, the default cli-version; plune-ai/plune#2310). A file reaches a test through
# a [[ATTACHMENT|path]] line in its output, the path counted from target/surefire-reports; with
# redirectTestOutputToFile=true Surefire moves that output out of the XML and the line does not reach
# the report.
#
# For steps and files attached with Allure.addAttachment(...), use Allure instead: add
# io.qameta.allure:allure-jupiter to the pom (before 2.35.1 it was allure-junit5, now only a relocation
# POM with no jar), put the line
#   allure.results.directory=target/allure-results
# in src/test/resources/allure.properties, as fixtures/maven does, and set report: target/allure-results.
# The @Step and @Attachment annotations also need the AspectJ agent, as Allure's documentation describes.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - uses: plune-ai/report-action@v1
        if: ${{ always() }}
        with:
          token: ${{ secrets.PLUNE_TOKEN }}
          report: target/surefire-reports
          run-title: maven on ${{ github.ref_name }}
          env: ci
          labels: java, junit5
