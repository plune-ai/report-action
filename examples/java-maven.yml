# Copy to .github/workflows/plune-report.yml. Sends a Maven (JUnit 5 + Allure) run to Plune.
#
# Surefire writes one XML file per test class and `plune run import` takes one file, so for Maven
# the report is the allure-results folder (allure-jupiter writes every test, its steps and its
# attachments there). Add io.qameta.allure:allure-jupiter to the pom (before 2.35.1 it was
# allure-junit5, now only a relocation POM with no jar) and put the line
#   allure.results.directory=target/allure-results
# in src/test/resources/allure.properties, as fixtures/maven does. Allure.step(...) and
# Allure.addAttachment(...) in a test then travel to Plune with its result; the @Step and @Attachment
# annotations also need the AspectJ agent, as Allure's documentation describes.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - uses: plune-ai/report-action@v1
        if: ${{ always() }}
        with:
          token: ${{ secrets.PLUNE_TOKEN }}
          report: target/allure-results
          run-title: maven on ${{ github.ref_name }}
          env: ci
          labels: java, junit5
