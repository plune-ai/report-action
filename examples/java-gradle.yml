# Copy to .github/workflows/plune-report.yml. Sends a Gradle (JUnit 5) run to Plune.
#
# Gradle writes a JUnit XML file per test class into build/test-results/test, and the action reads
# that folder as one run (@plune-ai/cli 0.32.0 or newer, the default cli-version): nothing to add to
# the build. Keys are classname#name with the method's parentheses (cart.CartTest#addsAnItem());
# Surefire drops them, so a move to Maven meets the cases under other keys. A file reaches a test
# through a [[ATTACHMENT|path]] line in its output, the path counted from build/test-results/test, and
# only with reports.junitXml.outputPerTestCase = true in the test task (by default Gradle keeps the
# output at suite level, where the import does not look).
#
# For steps and files attached with Allure.addAttachment(...), use Allure instead: add
# io.qameta.allure:allure-jupiter to the build (before 2.35.1 it was allure-junit5, now only a
# relocation POM with no jar), set the test task's system property allure.results.directory to
# build/allure-results, as fixtures/gradle/build.gradle.kts does, and set report: build/allure-results.
# The @Step and @Attachment annotations also need the AspectJ agent, as Allure's documentation describes.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew test
      - uses: plune-ai/report-action@v1
        if: ${{ always() }}
        with:
          token: ${{ secrets.PLUNE_TOKEN }}
          report: build/test-results/test
          run-title: gradle on ${{ github.ref_name }}
          env: ci
          labels: java, junit5
