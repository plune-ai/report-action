name: Smoke

# Runs THIS action, from the working tree, against fixtures and a local stub of the Plune API
# (test/stub-plune.mjs), so a change to action.yml, the scripts or the pinned CLI version has to prove
# itself on the pull request that makes it. It runs the real, pinned @plune-ai/cli from npm.
#
# No secret is read: the token is a made-up string the stub accepts. Fork pull requests are safe too.
# NOT covered: a real GitHub-hosted run against beta.plune.ai (that needs a real token).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  junit:
    name: "GitHub Action · report-action · JUnit · results and a file arrive, outputs are set"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - id: report
        uses: ./
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/junit/report.xml
          run-title: smoke junit
          env: smoke
          labels: smoke, junit

      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"0","results":3,"files":1}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

  # npx is npx.cmd on Windows (plune-ai/report-action#4): the same JUnit case on a Windows runner.
  junit-windows:
    name: "GitHub Action · report-action · JUnit · on a Windows runner, results and a file arrive, outputs are set"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # the steps below are bash (&, $(seq)); the Windows default would be pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 < /dev/null &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - id: report
        uses: ./
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/junit/report.xml
          run-title: smoke junit windows
          env: smoke
          labels: smoke, junit, windows

      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"0","results":3,"files":1}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

      - name: What the stub saw, when a step failed
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/stub.log"

  allure:
    name: "GitHub Action · report-action · Allure · an allure-results folder arrives with its attachment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - id: report
        uses: ./
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/allure-results
          run-title: smoke allure
          env: smoke
          labels: smoke, allure

      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"2","failed":"0","files-uploaded":"1","missing-attachments":"0","results":2,"files":1}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

  missing:
    name: "GitHub Action · report-action · JUnit · a missing attachment is counted and does not fail the step"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - id: report
        uses: ./
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/junit-missing/report.xml
          run-title: smoke missing
          env: smoke
          labels: smoke, missing

      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"1","results":3,"files":1}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

  missing-fail:
    name: "GitHub Action · report-action · JUnit · fail-on-missing-attachments turns the step red, results still sent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - id: report
        uses: ./
        continue-on-error: true
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/junit-missing/report.xml
          run-title: smoke missing-fail
          env: smoke
          labels: smoke, missing-fail
          fail-on-missing-attachments: 'true'

      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"1","results":3,"files":1}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

      - name: The step was red, as asked
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.report.outcome }}
        run: test "$OUTCOME" = failure

  gate:
    name: "GitHub Action · report-action · JUnit · fail-on-failures turns the step red on a failed test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - id: report
        uses: ./
        continue-on-error: true
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/junit/report.xml
          run-title: smoke gate
          env: smoke
          labels: smoke, gate
          fail-on-failures: 'true'

      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"0","results":3,"files":1}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

      - name: The step was red, as asked
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.report.outcome }}
        run: test "$OUTCOME" = failure

  # A real stack, not a fixture: xUnit through JunitXml.TestLogger, the commands the docs give for .NET.
  dotnet:
    name: "GitHub Action · report-action · .NET · dotnet test with the JUnit logger: 3 results and the attached file arrive"
    runs-on: ubuntu-latest
    env:
      RESULTS_DIR: ${{ github.workspace }}/dotnet-results   # the logger writes here, and the test saves its file here
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - name: dotnet test (one test fails on purpose, so the step is red)
        continue-on-error: true
        working-directory: fixtures/dotnet
        run: dotnet test --logger "junit;LogFilePath=$RESULTS_DIR/report.xml"

      - name: The report the logger wrote
        run: cat "$RESULTS_DIR/report.xml"

      - id: report
        uses: ./
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: dotnet-results/report.xml
          run-title: smoke dotnet
          env: smoke
          labels: smoke, dotnet

      # `failed` is 0: it counts results that did not reach Plune. The failed test is in `statuses`.
      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"0","results":3,"files":1,"statuses":"failure,pass,skipped"}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791

  # A real stack, not a fixture: JUnit 5 with allure-jupiter under Gradle, the commands the docs give for Gradle.
  # The report is the allure-results folder: Gradle writes one JUnit XML file per class and the import takes one file.
  gradle:
    name: "GitHub Action · report-action · Gradle · gradle test with allure-jupiter: 3 results and the attached file arrive"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # v5, not v6: v6 bundles a caching component under separate, non-MIT terms of use.
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: '9.8.1'

      - name: Start the local Plune API stub
        run: |
          node test/stub-plune.mjs 8791 > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 20); do curl -fs http://127.0.0.1:8791/__state > /dev/null && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/stub.log"; exit 1

      - name: gradle test (one test fails on purpose, so the step is red)
        continue-on-error: true
        working-directory: fixtures/gradle
        run: gradle test

      - name: The folder Allure wrote
        run: ls -l fixtures/gradle/build/allure-results

      # Gradle's own JUnit XML, one file per class, as written: a live sample for reading a folder of
      # JUnit files (plune-ai/plune#2309). Not imported here.
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: gradle-junit-xml
          path: fixtures/gradle/build/test-results/test/
          retention-days: 7

      - id: report
        uses: ./
        with:
          token: smoke-token-not-a-secret
          api-url: http://127.0.0.1:8791
          report: fixtures/gradle/build/allure-results
          run-title: smoke gradle
          env: smoke
          labels: smoke, gradle

      # `failed` is 0: it counts results that did not reach Plune. The failed test is in `statuses`.
      - name: The outputs and the stub agree
        env:
          TOKEN: smoke-token-not-a-secret
          RUN_URL: ${{ steps.report.outputs.run-url }}
          UPLOADED: ${{ steps.report.outputs.uploaded }}
          FAILED: ${{ steps.report.outputs.failed }}
          FILES_UPLOADED: ${{ steps.report.outputs.files-uploaded }}
          MISSING: ${{ steps.report.outputs.missing-attachments }}
          EXPECT: '{"uploaded":"3","failed":"0","files-uploaded":"1","missing-attachments":"0","results":3,"files":1,"statuses":"failed,passed,skipped"}'
        run: node test/smoke-assert.mjs http://127.0.0.1:8791
