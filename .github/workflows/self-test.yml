name: Self-test

# Runs THIS action, from the working tree, on a GitHub-hosted runner against the real Plune API on beta
# (plune-ai/report-action#3). The fixture goes into a test project, the outputs are checked, the same
# key is imported again, a report naming a missing file is imported, and the runs are deleted. smoke.yml
# covers the same paths against a local stub, forks included; this is what a stub cannot show.
#
# PLUNE_TOKEN is a project token (scope write) of the test project: every request with it lands in that
# project, so no X-Plune-Project header is sent. Fork pull requests get no secrets, so the jobs are skipped
# there instead of failing on an empty token.
#
# The test project must trust the junit source (Settings → Trusted sources). With create: 'true' the first
# run then turns the fixture's three tests into cases and records their results, and later runs match those
# cases: a test that already matches a case is never offered for review at all, so none is made twice
# (`known` is the answer to a proposal in the review items, not what Plune says for a matched test). The
# job checks this after its imports: each of the three tests has exactly one case. Untrusted, the tests
# only wait in the review queue, nothing is counted, and the uploaded checks below fail.
# NOT covered: Windows and macOS runners, Playwright JSON and Allure reports, shards.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One at a time per ref, queued, never cancelled. Runs of different refs may overlap in the test project,
# which is safe: every run's key carries run_id and run_attempt, and the cleanup deletes only that run's own
# keys.
concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    name: "GitHub Action · report-action · JUnit · live on beta: the fixture arrives, a re-run with the same key joins the same run, a missing file does not fail the step"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      check-run-id: ${{ job.check_run_id }}
    env:
      API_URL: https://beta-api.plune.ai
      RUN_KEY: self-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - id: first
        uses: ./
        with:
          token: ${{ secrets.PLUNE_TOKEN }}
          api-url: ${{ env.API_URL }}
          report: fixtures/junit/report.xml
          run-title: ${{ env.RUN_KEY }}
          labels: self-test
          key: ${{ env.RUN_KEY }}
          create: 'true'

      # The same key again, as a job re-run does when the key leaves out run_attempt. It must join the run
      # the first import opened, not open a second one. That run is finished, so Plune refuses the results
      # (409, closed to new results): they come back as not delivered, with a warning, and the step is green.
      - id: rerun
        uses: ./
        with:
          token: ${{ secrets.PLUNE_TOKEN }}
          api-url: ${{ env.API_URL }}
          report: fixtures/junit/report.xml
          run-title: ${{ env.RUN_KEY }}
          labels: self-test
          key: ${{ env.RUN_KEY }}
          create: 'true'

      # fixtures/junit-missing/report.xml names cart.png, which is there, and gone.png, which is not.
      # fail-on-missing-attachments stays at its default (false), so this step must stay green: a red one
      # stops the job here. Its warning is checked by the job below, once this one has finished.
      - id: missing
        uses: ./
        with:
          token: ${{ secrets.PLUNE_TOKEN }}
          api-url: ${{ env.API_URL }}
          report: fixtures/junit-missing/report.xml
          run-title: ${{ env.RUN_KEY }}-missing
          labels: self-test
          key: ${{ env.RUN_KEY }}-missing
          create: 'true'

      - name: "First import: 3 results and 1 file arrived, nothing lost. Re-run: same run, nothing counted twice. Missing file: counted, results sent"
        env:
          RUN_URL: ${{ steps.first.outputs.run-url }}
          UPLOADED: ${{ steps.first.outputs.uploaded }}
          FAILED: ${{ steps.first.outputs.failed }}
          FILES_UPLOADED: ${{ steps.first.outputs.files-uploaded }}
          MISSING: ${{ steps.first.outputs.missing-attachments }}
          RERUN_URL: ${{ steps.rerun.outputs.run-url }}
          RERUN_UPLOADED: ${{ steps.rerun.outputs.uploaded }}
          RERUN_FAILED: ${{ steps.rerun.outputs.failed }}
          RERUN_FILES_UPLOADED: ${{ steps.rerun.outputs.files-uploaded }}
          M_UPLOADED: ${{ steps.missing.outputs.uploaded }}
          M_MISSING: ${{ steps.missing.outputs.missing-attachments }}
        run: |
          bad=0
          expect() { if [ "$2" != "$3" ]; then echo "::error::$1: expected '$3', got '$2'"; bad=1; fi; }
          # fixtures/junit/report.xml: 3 test cases, one [[ATTACHMENT|cart.png]] that is there.
          expect uploaded "$UPLOADED" 3
          [ "$UPLOADED" = 3 ] || echo "::notice::If the import says «offered to the review queue», the test project has no cases for the fixture and does not trust junit: add it under Settings → Trusted sources."
          expect failed "$FAILED" 0
          expect files-uploaded "$FILES_UPLOADED" 1
          expect missing-attachments "$MISSING" 0
          [[ "$RUN_URL" =~ /runs/[0-9a-f-]{36}$ ]] || { echo "::error::run-url: no run address, got '$RUN_URL'"; bad=1; }
          expect "re-run run-url" "$RERUN_URL" "$RUN_URL"
          expect "re-run uploaded" "$RERUN_UPLOADED" 0
          # Shown, not checked: the run is closed, so Plune answers 409 to the re-run's results and the CLI
          # counts them as not delivered. That is the platform's answer of today, not the action's contract.
          echo "re-run: failed=$RERUN_FAILED files-uploaded=$RERUN_FILES_UPLOADED (shown, not checked)"
          expect "missing-file uploaded" "$M_UPLOADED" 3
          [ "$M_MISSING" -gt 0 ] 2>/dev/null || { echo "::error::missing-attachments: expected more than 0, got '$M_MISSING'"; bad=1; }
          exit "$bad"

      # A repeated import must match the cases the first one made, not make new ones. All three reports
      # carry the same tests; the CLI titles a JUnit testcase "<classname> › <name>" (titleOf in the CLI's
      # JUnit importer). q is a substring search over title, description, steps and more, so `matching`
      # alone proves nothing: the cases whose title is exactly that are counted.
      - name: "Repeated imports: every test of the fixture has exactly one case"
        env:
          PLUNE_TOKEN: ${{ secrets.PLUNE_TOKEN }}
        run: |
          bad=0
          # The header goes in on stdin, so the token is never on a command line.
          api() { printf 'Authorization: Bearer %s\n' "$PLUNE_TOKEN" | curl -sS -H @- "$@"; }
          body=$(mktemp)
          for name in adds_item removes_item total_is_wrong; do
            title="shop.Cart › $name"
            code=$(api -o "$body" -w '%{http_code}' -G --data-urlencode "q=$name" --data 'limit=200' "$API_URL/v1/test-cases" || true)
            if [ "$code" != 200 ]; then echo "::error::Looking up the cases of $name failed (HTTP $code)."; bad=1; continue; fi
            if ! count=$(jq -e --arg t "$title" '[.testCases[] | select(.title == $t)] | length' "$body"); then
              echo "::error::The answer to the case lookup of $name has no testCases list."; bad=1; continue
            fi
            echo "$name: $count case(s) titled '$title' (q matched $(jq -r '.matching' "$body"); titles found: $(jq -c '[.testCases[].title]' "$body"))"
            [ "$count" = 1 ] || { echo "::error::$name: expected 1 case titled '$title', found $count."; bad=1; }
          done
          exit "$bad"

      # Found by key as well as by the addresses the CLI printed: a run that opened and then failed or timed
      # out printed no address, and is still deleted. Both keys of this job: the rerun step reuses RUN_KEY.
      - name: Delete the runs from the test project
        if: always()
        env:
          PLUNE_TOKEN: ${{ secrets.PLUNE_TOKEN }}
          URLS: |
            ${{ steps.first.outputs.run-url }}
            ${{ steps.rerun.outputs.run-url }}
            ${{ steps.missing.outputs.run-url }}
        run: |
          bad=0
          # The header goes in on stdin, so the token is never on a command line.
          api() { printf 'Authorization: Bearer %s\n' "$PLUNE_TOKEN" | curl -sS -H @- "$@"; }
          ids=$(grep -oE '/runs/[0-9a-f-]{36}$' <<< "$URLS" | cut -d/ -f3 || true)
          body=$(mktemp)
          for key in "$RUN_KEY" "$RUN_KEY-missing"; do
            code=$(api -o "$body" -w '%{http_code}' -G --data-urlencode "key=$key" "$API_URL/v1/runs" || true)
            if [ "$code" != 200 ]; then echo "::error::Looking up the runs with key $key failed (HTTP $code): check the test project by hand."; bad=1; continue; fi
            if ! jq -e '.runs | type == "array"' "$body" > /dev/null 2>&1; then
              echo "::error::The answer to the lookup of key $key has no runs list: check the test project by hand."; bad=1; continue
            fi
            found=$(jq -r '.runs[].id // empty' "$body")
            echo "Key $key: $(grep -c . <<< "$found" || true) run(s)."
            for id in $found; do
              if [[ "$id" =~ ^[0-9a-f-]{36}$ ]]; then ids+=$'\n'"$id"; else echo "::error::Key $key: run id '$id' is not a run id: delete it by hand."; bad=1; fi
            done
          done
          ids=$(grep . <<< "$ids" | sort -u || true)
          if [ -z "$ids" ]; then
            [ "$bad" = 0 ] && echo "No run was opened, nothing to delete."
            exit "$bad"
          fi
          for id in $ids; do
            code=$(api -o /dev/null -w '%{http_code}' -X DELETE "$API_URL/v1/runs/$id" || true)
            if [ "$code" = 204 ]; then echo "Deleted run $id."; else echo "::error::Run $id was not deleted (HTTP $code): delete it by hand in the test project."; bad=1; fi
          done
          exit "$bad"

  # The action shows a missing file as a ::warning:: line, which becomes an annotation of the job. A step
  # cannot read its own job's log, so this job reads the annotations of the finished one.
  warning:
    name: "GitHub Action · report-action · JUnit · live on beta: the missing file shows as a warning on the job"
    needs: beta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: The beta job carries the warning about the missing file
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ needs.beta.outputs.check-run-id }}
        run: |
          # The annotations of a just-finished job may not all be readable yet: up to 3 reads, 5 s apart.
          for attempt in 1 2 3; do
            warnings=$(gh api --paginate "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID/annotations" --jq '.[] | select(.annotation_level == "warning") | .message') || warnings=''
            if grep -q 'file(s) the report names were not found and were not uploaded' <<< "$warnings"; then
              printf '%s\n' "$warnings"
              echo "Attempt $attempt of 3 found the warning about the missing file."
              exit 0
            fi
            echo "Attempt $attempt of 3: no warning about the missing file yet."
            [ "$attempt" = 3 ] || sleep 5
          done
          printf '%s\n' "$warnings"
          echo "::error::No warning about the missing file among the annotations of check run $CHECK_RUN_ID."
          exit 1
